# PROD: images are pulled from ghcr.io (built in CI). The IMAGE_*/IMAGE_TAG variables
# are exported by the workflow during deploy; for a manual run on the server, set the same ones.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_DB: ${DB_NAME:-onlinetlabs}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # the port is NOT published to the outside
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # the port is NOT published to the outside
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5
    networks:
      - default
      - shared          # gns3-service reaches redis by name through the shared network

  backend:
    image: ${IMAGE_BACKEND:-ghcr.io/nevsky118/onlinetlabs-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./backend.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - default
      - shared          # shared network with the gns3 stack (gns3-service/server/mcp by name)

  web:
    image: ${IMAGE_WEB:-ghcr.io/nevsky118/onlinetlabs-web}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # web reads no runtime env, NEXT_PUBLIC_* are baked into the image, so no env_file
    environment:
      NODE_ENV: production

  dashboard:
    image: ${IMAGE_DASHBOARD:-ghcr.io/nevsky118/onlinetlabs-dashboard}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./frontend.env
    environment:
      BACKEND_URL: http://backend:8000
      NODE_ENV: production
      # Domain is deployment config, not a secret, safe in tracked compose. See packages/auth/betterauth.ts.
      COOKIE_DOMAIN: .sumuinen.com
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN required}   # domain comes from env, not from the repo
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:?DASHBOARD_DOMAIN required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro      # Cloudflare Origin Certificate (origin.pem + origin-key.pem)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - dashboard
      - backend
    networks:
      - default
      - shared          # shared network with the gns3 stack, we proxy the GNS3 Web UI to gns3-server

networks:
  shared:
    external: true
    name: onlinetlabs_net      # created once with: docker network create onlinetlabs_net

volumes:
  pgdata:
  caddy_data:
  caddy_config:
