# PROD: images are pulled from ghcr.io (built in CI). The IMAGE_*/IMAGE_TAG variables
# are exported by the workflow during deploy; for a manual run on the server, set the same ones.

# Log rotation cap.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_DB: ${DB_NAME:-onlinetlabs}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # the port is NOT published to the outside
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD required}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    # the port is NOT published to the outside
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5
    networks:
      - default
      - shared          # gns3-service reaches redis by name through the shared network

  backend:
    image: ${IMAGE_BACKEND:-ghcr.io/nevsky118/onlinetlabs-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./backend.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379/0
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - default
      - shared          # shared network with the gns3 stack (gns3-service/server/mcp by name)

  web:
    image: ${IMAGE_WEB:-ghcr.io/nevsky118/onlinetlabs-web}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    # web reads no runtime env, NEXT_PUBLIC_* are baked into the image, so no env_file
    environment:
      NODE_ENV: production
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          require('http').get({host:process.env.HOSTNAME||'127.0.0.1',port:3001,path:'/',timeout:3000},
            r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  dashboard:
    image: ${IMAGE_DASHBOARD:-ghcr.io/nevsky118/onlinetlabs-dashboard}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./frontend.env
    environment:
      BACKEND_URL: http://backend:8000
      NODE_ENV: production
      # COOKIE_DOMAIN comes from frontend.env (dashboard env_file).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          require('http').get({host:process.env.HOSTNAME||'127.0.0.1',port:3000,path:'/',timeout:3000},
            r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN required}   # domain comes from env, not from the repo
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:?DASHBOARD_DOMAIN required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro      # Cloudflare Origin Certificate (origin.pem + origin-key.pem)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - dashboard
      - backend
    networks:
      - default
      - shared          # shared network with the gns3 stack, we proxy the GNS3 Web UI to gns3-server

networks:
  shared:
    external: true
    name: onlinetlabs_net      # created once with: docker network create onlinetlabs_net

volumes:
  pgdata:
  caddy_data:
  caddy_config:
