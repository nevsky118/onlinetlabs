services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-onlinetlabs}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # 18+ stores data in a major-version subdirectory, so the mount sits one level up
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend.env
    environment:
      # Override the host localhost addresses from .env with docker network ones.
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      # The gns3 stack runs as a separate compose with ports on the host, so we reach it through host-gateway.
      GNS3_SERVICE_URL: http://host.docker.internal:8101
      MCP_SERVER_URL: http://host.docker.internal:8100
      # Console TCP ports of VPCS/nodes are not published to the host (range 2001-5000).
      # We connect directly to gns3-server by its container DNS name through
      # the shared gns3_default network (see networks below).
      GNS3_NODE_HOST: gns3-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - gns3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5

  web:
    build:
      context: ../../frontend
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* are inlined at build time. Addresses are browser-side, the browser runs on the host.
        NEXT_PUBLIC_WEB_URL: http://localhost:3001
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        NEXT_PUBLIC_AUTH_URL: http://localhost:3000
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8000
        NEXT_PUBLIC_ANALYTICS_URL: http://localhost:3000
    ports:
      - "3001:3001"
    # web reads no runtime env, NEXT_PUBLIC_* are baked into the image, so no env_file
    environment:
      NODE_ENV: production

  dashboard:
    build:
      context: ../../frontend
      dockerfile: apps/dashboard/Dockerfile
      args:
        # NEXT_PUBLIC_* are inlined at build time. Addresses are browser-side, the browser runs on the host.
        NEXT_PUBLIC_WEB_URL: http://localhost:3001
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        NEXT_PUBLIC_AUTH_URL: http://localhost:3000
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    env_file:
      - ./frontend.env
    environment:
      # Dashboard server-side calls reach the backend over the docker network, not localhost
      BACKEND_URL: http://backend:8000
      NODE_ENV: production
      # Empty, browsers reject a cookie Domain on localhost. See packages/auth/betterauth.ts.
      COOKIE_DOMAIN: ""
    depends_on:
      backend:
        condition: service_healthy

networks:
  default: {}
  gns3:
    name: gns3_default
    external: true

volumes:
  pgdata:
