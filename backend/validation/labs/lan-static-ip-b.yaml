slug: lan-static-ip-b
steps:
  - id: pc-ips
    title:
      en: PCs configured
      ru: PC настроены
    checks:
      - kind: vpcs.show_ip
        node: PC1
        expect:
          ip: "10.0.0.11/24"
          gateway: "0.0.0.0"
      - kind: vpcs.show_ip
        node: PC2
        expect:
          ip: "10.0.0.12/24"
          gateway: "0.0.0.0"
  - id: connectivity
    title:
      en: Connectivity
      ru: Связность
    checks:
      - kind: vpcs.ping
        from: PC1
        to: "10.0.0.12"
        expect:
          received: ">=4"
