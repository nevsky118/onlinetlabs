slug: dhcp-basics
steps:
  - id: dhcp-lease
    title:
      en: PCs got an address via DHCP
      ru: PC получили адрес по DHCP
    checks:
      - kind: vpcs.ip_in_subnet
        node: PC1
        expect:
          subnet: "192.168.10.0/24"
          gateway: "192.168.10.1"
      - kind: vpcs.ip_in_subnet
        node: PC2
        expect:
          subnet: "192.168.10.0/24"
          gateway: "192.168.10.1"
  - id: connectivity
    title:
      en: PC1 reaches PC2
      ru: PC1 видит PC2
    checks:
      - kind: vpcs.ping_node
        from: PC1
        to_node: PC2
        expect:
          received: ">=4"
