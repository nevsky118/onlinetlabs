<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>GNS3 — открываем лабораторию</title>
</head>
<body>
  <p id="status">Открываем лабораторию в GNS3…</p>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var ticket = params.get('ticket');
      var project = params.get('project');

      function fail(message) {
        document.getElementById('status').textContent = message;
      }

      // The GNS3 Web UI stores the server connection as "controller-<id>" in
      // localStorage and crashes with "Cannot read properties of null (reading
      // 'authToken')" on /login and /project when that entry is missing. Normally
      // it is created by the "Add Controller" wizard on the first visit.
      // We register it in the same format GNS3 itself uses (see controllers.component),
      // filling in host/port/protocol from the current origin, so the link stays
      // working regardless of the domain/port GNS3 is published on.
      function controller() {
        var raw = localStorage.getItem('controller-1');
        if (raw) {
          try { return JSON.parse(raw); } catch (e) { /* rewritten below */ }
        }
        localStorage.setItem('controllerIds', 'controller-1');
        return {
          name: 'GNS3 server',
          location: 'remote',
          path: '',
          ubridge_path: '',
          host: window.location.hostname,
          port: Number(window.location.port) || (window.location.protocol === 'https:' ? 443 : 80),
          protocol: window.location.protocol,
          id: 1
        };
      }

      function open(token) {
        var ctrl = controller();
        // Presetting authToken skips the login form entirely, so no credential
        // is ever typed, stored or left in localStorage.
        ctrl.authToken = token;
        delete ctrl.username;
        delete ctrl.password;
        delete ctrl.tokenExpired;
        localStorage.setItem('controller-1', JSON.stringify(ctrl));
        // A password used to live here under isRememberMe. Clear any leftover.
        localStorage.removeItem('isRememberMe');
        window.location.replace(
          project ? 'controller/1/project/' + project : 'controller/1/projects'
        );
      }

      if (!ticket) {
        fail('Ссылка на лабораторию недействительна. Откройте лабораторию заново.');
        return;
      }

      fetch('/api/gns3/redeem', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ ticket: ticket })
      })
        .then(function (response) {
          if (!response.ok) {
            return response.json().catch(function () { return {}; }).then(function (body) {
              throw new Error(body.detail || 'redeem failed');
            });
          }
          return response.json();
        })
        .then(function (body) { open(body.gns3_jwt); })
        .catch(function (error) {
          fail(error.message || 'Не удалось открыть лабораторию. Откройте её заново.');
        });
    })();
  </script>
</body>
</html>
