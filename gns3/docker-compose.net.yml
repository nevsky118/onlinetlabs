# Overlay: attaches the gns3 services to the EXTERNAL shared network onlinetlabs_net,
# so that the main stack's backend sees gns3-service/server/mcp by name,
# and gns3-service uses the main stack's redis (redis://redis:6379/0).
# The network is created once with: docker network create onlinetlabs_net
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.kvm.yml -f docker-compose.net.yml ...
services:
  gns3-server:
    networks: [default, shared]
  gns3-service:
    networks: [default, shared]
  gns3-mcp:
    networks: [default, shared]

networks:
  shared:
    external: true
    name: onlinetlabs_net
